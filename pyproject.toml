[project]
name = "chatjsoneditor"
version = "0.1.0"
description = "Local web editor for Claude Code session JSONL files: delete and undo whole turns."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
chatjsoneditor = "chatjsoneditor.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatjsoneditor"]
